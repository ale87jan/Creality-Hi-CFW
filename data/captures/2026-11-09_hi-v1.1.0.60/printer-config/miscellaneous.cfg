# Compatibility macros and configurations
# This file contains macros and configurations to ensure compatibility with Creality's existing scripts and features.
# It includes a virtual fan0 output, custom RESPONSE_INFO and SET_PIN macros, auto-trileveling steps, startup RFID
# scanning, and maintenance item tracking.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

# Virtual Fan0 output pin configuration for compatibility with Creality Macros
[output_pin fan0]
pin: PB2
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[gcode_macro RESPONSE_INFO]
description: Custom RESPONSE_INFO macro for compatibility with Creality existing scripts
gcode:
  {% set prefix = params.PREFIX | default("CREALITY?") %}
  {% set msg = params.MSG|default("response info") %}
  {action_respond_info(prefix + " " + msg)}

[gcode_macro SET_PIN]
description: Custom SET_PIN macro for compatibility with Creality existing scripts
rename_existing: _SET_PIN_BASE
gcode:
    {% set pin = params.PIN|default("")|lower %}
    {% set value = params.VALUE|float %}

    {% if pin == "fan0" %}
      {% if value == 0 %}
        M107
      {% else %}
        # For compatibility with Creality scripts, double the value to match the expected range for the fan speed (0-255)
        {% if value <= 128 %}
          {% set value = [value * 2, 255] | min %}
        {% endif %}
        M106 S{value}
      {% endif %}
    {% else %}
      RESPONSE_INFO PREFIX="[SET_PIN]" MSG="Setting pin {pin} to value {value}"
      _SET_PIN_BASE {rawparams}
    {% endif %}

[gcode_macro A_TriPress_STEP1]
description: Auto-trileveling step 1 (unknown if needed, but included for compatibility with Creality existing scripts)
gcode:
  RESPONSE_INFO PREFIX="[A_TriPress_STEP1]" MSG="Starting auto-trileveling step 1..."
  G28
  G1 Z25 F600

[gcode_macro A_TriPress_STEP2]
description: Auto-trileveling step 2 (unknown if needed, but included for compatibility with Creality existing scripts)
gcode:
  RESPONSE_INFO PREFIX="[A_TriPress_STEP2]" MSG="Starting auto-trileveling step 2..."
  PROBE_ACCURACY PROBE_SPEED=5

# This feature includes RFID scanning upon power-on to prevent RFID malfunction after scanning during the power-on process.
[delayed_gcode STARTUP_READ_FILAMENT_RACK_RFID]
# Delayed read Filament Rack RFID on startup
initial_duration: 2
gcode:
  RESPONSE_INFO PREFIX="[STARTUP_READ_FILAMENT_RACK_RFID]" MSG="Reading Filament Rack RFID on startup..."
  FILAMENT_RACK

[gcode_macro MAINTENANCE_ITEM_PARAM]
description: Maintenance item parameters
variable_motion_mechanism_lubrication: 1800000  # Seconds 500 hours
variable_cut_calibration: 10000                 # Times
variable_shaper_calibrate: 1800000              # Seconds 500 hours
variable_belt_tensioning: 3600000               # Seconds 1000 hours
variable_camera_maintenance: 1800000            # Seconds 500 hours
variable_fan_inspection: 1800000                # Seconds 500 hours
variable_nozzle: 20000                          # Grams of filament used
variable_cut: 100000                            # Times used
variable_machine_teflon_tube: 3600000           # Seconds 1000 hours
variable_wipe_mouth_strip: 1800000              # Seconds 500 hours
variable_air_filter: 1800000                    # Seconds 500 hours
variable_cfs_teflon_tube: 3600000               # Seconds 1000 hours
variable_cfs_desiccant: 1800000                 # Seconds 500 hours
gcode:

[gcode_macro MAINTENANCE_ITEM]
description: Maintenance item tracking and decrementing
gcode:

[gcode_macro SHOW_MAINTENANCE_ITEM]
description: Report maintenance item status
gcode:
  {action_respond_info("Maintenance Items Status:")}
  {action_respond_info("Motion Mechanism Lubrication: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].motion_mechanism_lubrication / 3600)|round(1))}
  {action_respond_info("Cut Calibration: %d uses left" % printer['gcode_macro MAINTENANCE_ITEM_PARAM'].cut_calibration)}
  {action_respond_info("Shaper Calibrate: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].shaper_calibrate / 3600)|round(1))}
  {action_respond_info("Belt Tensioning: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].belt_tensioning / 3600)|round(1))}
  {action_respond_info("Camera Maintenance: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].camera_maintenance / 3600)|round(1))}
  {action_respond_info("Fan Inspection: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].fan_inspection / 3600)|round(1))}
  {action_respond_info("Nozzle Usage: %f kg used" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].nozzle / 1000)|round(1))}
  {action_respond_info("Cut Usage: %d uses left" % printer['gcode_macro MAINTENANCE_ITEM_PARAM'].cut)}
  {action_respond_info("Machine Teflon Tube: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].machine_teflon_tube / 3600)|round(1))}
  {action_respond_info("Wipe Mouth Strip: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].wipe_mouth_strip / 3600)|round(1))}
  {action_respond_info("Air Filter: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].air_filter / 3600)|round(1))}
  {action_respond_info("CFS Teflon Tube: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].cfs_teflon_tube / 3600)|round(1))}
  {action_respond_info("CFS Desiccant: %f hrs left" % (printer['gcode_macro MAINTENANCE_ITEM_PARAM'].cfs_desiccant / 3600)|round(1))}
