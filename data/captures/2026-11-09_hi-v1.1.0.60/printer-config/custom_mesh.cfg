# Custom bed mesh configuration for Creality Hi
# This configuration file defines custom macros to handle bed mesh
# calibration and loading based on bed temperature. It includes macros
# to create a new mesh profile if one does not exist for the specified
# bed temperature.
# This file is intended to be included in the main printer configuration.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro G29]
description: Custom routine to calibrate bed mesh
# G29 BED_TEMP=55 SOAK_TIME=5
gcode:
  SAVE_GCODE_STATE NAME=G29_state
  {% set EXTRUDER_WAITTEMP = printer.custom_macro.g28_ext_temp|default(140.0)|float %}
  {% set BED_TEMP = params.BED_TEMP|string|replace("=","")|default(55.0)|float %}
  {% set SOAK_TIME = params.SOAK_TIME|string|replace("=","")|default(5)|int %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}

  RESPONSE_INFO PREFIX="[G29]" MSG="Starting bed mesh calibration for profile: {PROFILE_NAME}"

  M140 S{BED_TEMP-10} # Preheat bed to slightly below target temperature to reduce thermal expansion during initial setup
  M104 S{EXTRUDER_WAITTEMP}

  IF_XY_NEED_HOME

  SET_ADJUSTMENTS_FLAG VALUE=1 # Set flag to save new Z tilt/align adjustments
  G28 Z

  BED_MESH_CLEAR
  NOZZLE_WIPE # Clean nozzle before bed mesh calibration to ensure accurate measurements
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

  M190 S{BED_TEMP}
  M109 S{EXTRUDER_WAITTEMP}

  RESPONSE_INFO PREFIX="[G29]" MSG="Soaking for {SOAK_TIME} minutes..."
  {% if SOAK_TIME > 0 %}
    G4 P{60000 * SOAK_TIME} # X minute heat soak
  {% endif %}

  # Perform photoelectric leveling once after fine wiping the nozzle to obtain the maximum Z-axis height value.
  # Each time the leveling is performed, Z_TILT_ADJUST must be re-performed to obtain new adjustments.
  ZDOWN_SWITCH ENABLE=1
  G28 Z
  BED_MESH_CLEAR
  Z_TILT_ADJUST # Perform Z tilt adjustment to get new stepper motor adjustments
  ZDOWN_SWITCH ENABLE=0 # Disable photoelectric leveling

  G28 Z # Rehome Z after tilt adjust to get accurate Z height for bed mesh calibration
  SET_ADJUSTMENTS_FLAG VALUE=0  # Disable save new Z tilt/align adjustments

  PRINT_PREPARED

  RESPONSE_INFO PREFIX="[G29]" MSG="Creating bed mesh profile: {PROFILE_NAME}..."
  RESPONSE_INFO PREFIX="[G29]" MSG="Please wait, this may take a few minutes..."
  SET_VELOCITY_LIMIT ACCEL={(printer.toolhead.max_accel|int) / 4}
  BED_MESH_CALIBRATE PROFILE={PROFILE_NAME}

  G1 X130 Y130 Z10 F12000

  RESTORE_GCODE_STATE NAME=G29_state

  CXSAVE_CONFIG

[gcode_macro _MESH_IF_NEEDED]
description: Load or create bed mesh based on bed temperature
# Example usage: _MESH_IF_NEEDED BED_TEMP=55 SOAK_TIME=5
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(55.0)|float %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}
  {% set SOAK_TIME = params.SOAK_TIME|default(5)|int %}

  RESPONSE_INFO PREFIX="[MESH_IF_NEEDED]" MSG="Looking for {PROFILE_NAME} ..."

  {% if PROFILE_NAME in printer.bed_mesh.profiles %}
    RESPONSE_INFO PREFIX="[MESH_IF_NEEDED]" MSG="{PROFILE_NAME} exists ..."
  {% else %}
    RESPONSE_INFO PREFIX="[MESH_IF_NEEDED]" MSG="{PROFILE_NAME} does not exist, creating ..."
    G29 BED_TEMP={BED_TEMP} SOAK_TIME={SOAK_TIME}
  {% endif %}

  BED_MESH_PROFILE LOAD={PROFILE_NAME}
