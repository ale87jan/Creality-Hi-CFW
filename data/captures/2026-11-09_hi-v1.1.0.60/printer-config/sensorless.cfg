# Sensorless homing for Creality Hi
# This configuration file sets up X and Y axes for sensorless homing and
# Z axis with dual endstops using the Creality PRTouch V3 method. It also
# includes variables to track the homing status of each axis.
# This file is intended to be included in the main printer configuration.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[force_move]
enable_force_move: true

[gcode_macro xyz_ready]
description: XYZ axes ready status for sensorless homing
variable_x_ready: 0
variable_y_ready: 0
variable_z_ready: 0
variable_xy_moved: 0
variable_z_moved: 0
variable_zdown_enable: 0
variable_safe_z: 5.0
gcode:
  {% set homed_axes = ({"X": printer['gcode_macro xyz_ready'].x_ready|int == 1,
                        "Y": printer['gcode_macro xyz_ready'].y_ready|int == 1,
                        "Z": printer['gcode_macro xyz_ready'].z_ready|int == 1}) %}
  {% set xyz_moved = ({"XY": printer['gcode_macro xyz_ready'].xy_moved|int == 1,
                        "Z": printer['gcode_macro xyz_ready'].z_moved|int == 1}) %}
  {action_respond_info("Already homed X%d Y%d Z%d\n" % (homed_axes["X"], homed_axes["Y"], homed_axes["Z"]))}
  {action_respond_info("Already moved XY%d Z%d\n" % (xyz_moved["XY"], xyz_moved["Z"]))}

# Homing override to use sensorless homing
[homing_override]
axes: xyz
gcode:
  SAVE_GCODE_STATE NAME=homing_override_state

  MOTOR_STALL_MODE DATA=1
  M220 S100
  BED_MESH_CLEAR

  {% set homed_axes = printer.toolhead.homed_axes %}
  {% if homed_axes is defined and homed_axes[0] is defined %}
    {% set homed_axes = ({"X": printer['gcode_macro xyz_ready'].x_ready|int == 1,
                          "Y": printer['gcode_macro xyz_ready'].y_ready|int == 1,
                          "Z": printer['gcode_macro xyz_ready'].z_ready|int == 1}) %}
    # RESPONSE_INFO PREFIX="[SENSORLESS_HOMING]" MSG="Already homed X{homed_axes['X']} Y{homed_axes['Y']} Z{homed_axes['Z']}"
  {% else %}
    {% set homed_axes = ({"X": 0, "Y": 0, "Z": 0}) %}
    # RESPONSE_INFO PREFIX="[SENSORLESS_HOMING]" MSG="No homed axes. Reset internal homing status"
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=0
  {% endif %}

  # If X is already homed and beyond max position, move it back within limits
  {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 %}
    {% set delta_x = printer.toolhead.position.x|int - printer["gcode_macro PRINTER_PARAM"].max_x_position|int %}
    {% if delta_x >= 0 %}
      G91
      G0 X-{delta_x} F3600
      G90
    {% endif %}
  {% endif %}

  # If Y is already homed and beyond max position, move it back within limits
  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    {% set delta_y = printer.toolhead.position.y|int - printer["gcode_macro PRINTER_PARAM"].max_y_position|int %}
    {% if delta_y >= 0 %}
      G91
      G0 Y-{delta_y} F3600
      G90
    {% endif %}
  {% endif %}

  {% set home_all = 'X' not in params and 'Y' not in params %}        # G28 without parameters
  {% if 'Z' in params and 'X' not in params and 'Y' not in params %}  # G28 Z only
    {% if homed_axes["X"] == 1 and homed_axes["Y"] == 1 %}            # If X and Y are homed
      {% set home_all = 0 %} # Do not home all axes
    {% endif %}
  {% endif %}

  {% if home_all or 'X' in params %} # G28 / G28 X / G28 X Y / G28 X Y Z
    _HOME_X
  {% endif %}
  {% if home_all or 'Y' in params %} # G28 / G28 Y / G28 X Y / G28 X Y Z
    _HOME_Y
  {% endif %}
  {% if home_all or 'Z' in params %} # G28 / G28 Z / G28 X Y Z
    _HOME_Z
  {% endif %}

  G4 P500
  MOTOR_STALL_MODE DATA=2
  MOTOR_CHECK_PROTECTION_AFTER_HOME DATA=11

  RESTORE_GCODE_STATE NAME=homing_override_state

[gcode_macro IF_XY_NEED_HOME]
description: Homes XY axes when needed
gcode:
  {% set homed_axes = ({"X": printer['gcode_macro xyz_ready'].x_ready|int == 1,
                        "Y": printer['gcode_macro xyz_ready'].y_ready|int == 1,
                        "Z": printer['gcode_macro xyz_ready'].z_ready|int == 1}) %}

  {% if homed_axes["X"] == 0 or homed_axes["Y"] == 0 %}
    G28 X Y
  {% else %}
    RESPONSE_INFO PREFIX="[IF_XY_NEED_HOME]" MSG="XY already homed"
  {% endif %}

[gcode_macro _IF_MOVE_XY]
description: Check XY homing conditions ensuring a safe Z position to prevent crashes during XY homing
gcode:
  _IF_HOME_Z
  {% if printer['gcode_macro xyz_ready'].xy_moved|int == 0 %}
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=1
  {% endif %}

[gcode_macro _HOME_X]
description: Home X-axis with sensorless homing
gcode:
  _IF_MOVE_XY
  # If X is already homed and too close to the endstop, move it away before homing again
  {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 and printer.toolhead.position.x|int < 10 %}
    G91
    G1 X10 F12000
    G90
  {% endif %}

  G28 X
  G91
  G0 X10 F12000
  G90

  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=1 # Mark X as homed

[gcode_macro _HOME_Y]
description: Home Y-axis with sensorless homing
gcode:
  _IF_MOVE_XY
  # If Y is already homed and too close to the endstop, move it away before homing again
  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 and printer.toolhead.position.y|int < 10 %}
    G91
    G1 Y10 F9000
    G90
  {% endif %}

  G28 Y
  G91
  G0 Y10 F9000
  G90

  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=1 # Mark Y as homed

[gcode_macro _IF_HOME_Z]
description: Check Z homing conditions and move Z to a safe height
gcode:
  # If Z is already homed and below safe height, move it up before homing again to prevent crashes
  {% if printer['gcode_macro xyz_ready'].z_ready|int == 1 and printer.toolhead.position.z|int < 5 %}
    {% set z_park = 5.0 - printer.toolhead.position.z|int %}
    G91
    G1 z{z_park} F600
    G90
  {% elif printer['gcode_macro xyz_ready'].z_moved|int == 0 %} # If Z has not been moved yet
    {% if printer.print_stats.power_loss == 1 %}
      # If recovering from power loss
      SET_KINEMATIC_POSITION
      G91
      UP_SAFE_Z # Dual endstop Z-axis homing upwards (Creality method)
      G90
    {% else %}
      # If Z has not been homed or moved yet and is not recovering from power loss, set Z position to 0 before homing
      # to prevent crashes due to uneven Z rise during homing
      SET_KINEMATIC_POSITION Z=0
      G0 Z0.01 F1200 # Resolve the bug where Z-axis rises unevenly
      G4 P500
      G91
      UP_SAFE_Z # Dual endstop Z-axis homing upwards (Creality method)
      G90
    {% endif %}
    M400 # Wait for moves to finish
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=1 # Mark Z as moved
  {% endif %}

[gcode_macro _HOME_Z]
description: Home Z-axis with sensorless homing
gcode:
  # Only home Z if both X and Y are already homed to prevent crashes
  {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 and printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    _IF_HOME_Z # Check Z homing conditions
  {% endif %}

  # Move to center before homing Z down
  G1 X130 Y130 F12000           # Move to bed center
  SET_KINEMATIC_POSITION Z=305  # Set Z position before homing
  G1 Z304 F1200                 # Move Z down a little to ensure the sensorless homing triggers correctly
  M400                          # Wait for moves to finish
  G28 Z                         # Home Z-axis down with sensorless homing (Creality prtouch_v3 method)
  G1 Z10 F300                   # Move Z up slightly after homing

  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=1

[gcode_macro ENABLE_ZDOWN]
description: Enable Zdown switch variable to allow Z homing down in the future
gcode:
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=zdown_enable VALUE=1

[gcode_macro M84]
description: Override M84 to reset homing status
rename_existing: M84.1
gcode:
  PRINT_PREPARE_CLEAR
  M84.1
