# Temperature and tuning macros
# Smart adaptive bed heating (M140/M190) with boost/braking thermal control, pressure advance (M900), acceleration
# tuning (M204), corner velocity control (M205), input shaper calibration, and assisted hotend cooling.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro _SMART_BED_VARS]
description: Variables for smart bed heating
variable_target_temp: 0.0     # Target bed temperature
variable_stage: 0             # 0: Inactive, 1: Boost Active
variable_boost: 10            # Degrees for boost phase
variable_lookahead_low: 5.0   # Degrees before target to start braking (at low temps)
variable_lookahead_high: 3.0  # Degrees before target to start braking (at high temps)
gcode:

[gcode_macro M140]
description: OVERRIDE M140: Asynchronous (Non-blocking) smart bed heating
rename_existing: M140.1
gcode:
  {% set BED_TEMP = params.S|default(55.0)|float %}
  {% set BOOST = printer["gcode_macro _SMART_BED_VARS"].boost|default(10.0)|float %} # Extra degrees for boost phase

  # Stop any previous monitor to avoid conflicts
  UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0

  {% if BED_TEMP > 0 %}
    # STAGE 1: Apply Boost. Trick the PID by requesting higher temperature
    # RESPONSE_INFO PREFIX="[Smart M140]" MSG="Heating to {BED_TEMP}C (Boost: {boost_temp}C)"
    {% set max_temp = printer['gcode_macro PRINTER_PARAM'].max_bed_temp %}
    {% set boost_temp = [BED_TEMP + BOOST, max_temp]|min %}

    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={boost_temp}

    # Save the REAL target in the variable
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE={BED_TEMP}
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=1

    # Start the monitor
    UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=1
  {% else %}
    # Turn off bed heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
  {% endif %}

[delayed_gcode _SMART_BED_MONITOR]
# Description: Monitor for smart bed heating (Only for M140)
gcode:
  {% set VARS = printer["gcode_macro _SMART_BED_VARS"] %}
  {% set CURRENT = printer.heater_bed.temperature %}
  {% set LOOKAHEAD = VARS.lookahead_low|default(3.0)|float if VARS.target_temp|float <= 70.0 else VARS.lookahead_high|default(5.0)|float %}

  {% if VARS.stage == 1 %}
    # Check if we have reached the braking zone
    {% if CURRENT >= (VARS.target_temp - LOOKAHEAD) %}
      # STAGE 2: Braking. Set the REAL temperature
      # RESPONSE_INFO PREFIX="[Smart M140]" MSG="Braking zone reached. Adjusting to {VARS.target_temp}C"
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={VARS.target_temp}
      SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
      UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0
    {% else %}
      # Continue monitoring every second
      UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=1
    {% endif %}
  {% endif %}

[gcode_macro M190]
description: OVERRIDE M190: Blocking smart bed heating (ideal for START_PRINT macros)
rename_existing: M190.1
gcode:
  {% set BED_TEMP = params.S|default(55.0)|float %}
  {% set VARS = printer["gcode_macro _SMART_BED_VARS"] %}
  {% set BOOST = VARS.boost|default(10.0)|float %}
  {% set LOOKAHEAD = VARS.lookahead_low|default(3.0)|float if BED_TEMP <= 70.0 else VARS.lookahead_high|default(5.0)|float %}

  # 1. Kill any previous background process (Previous M140)
  UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0

  {% if BED_TEMP > 0 %}
    # RESPONSE_INFO PREFIX="[Smart M190]" MSG="Starting heating sequence to {BED_TEMP}C..."
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE={BED_TEMP}
    # 2. Boost
    {% set max_temp = printer['gcode_macro PRINTER_PARAM'].max_bed_temp %}
    {% set boost_temp = [BED_TEMP + BOOST, max_temp]|min %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={boost_temp}

    # 3. Blocking wait until braking zone
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - LOOKAHEAD}

    # 4. Braking: Set the REAL target temperature
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    # RESPONSE_INFO PREFIX="[Smart M190]" MSG="Braking thermal inertia..."

    # 5. Final strict stabilization wait: wait until the real target is reached before continuing
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 0.5} MAXIMUM={BED_TEMP + 2.0}
    RESPONSE_INFO PREFIX="[Smart M190]" MSG="Temperature stabilized at {BED_TEMP}C."

  {% else %}
    # Turn off bed heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
  {% endif %}

[gcode_macro WAIT_TEMP_START]
description: Start assisted hotend cooling routine
gcode:
  # RESPONSE_INFO PREFIX="[WAIT_TEMP_START]" MSG="Starting assisted hotend cooling routine. Please wait..."
  UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=1
  M106 S255

[delayed_gcode WAIT_TEMP]
# Description: Routine to wait for hotend to cooldown with part fan assistance
initial_duration: 0
gcode:
  {% set cur_temp = printer.extruder.temperature %}
  {% if cur_temp|int > 50 %}
    UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=5
  {% else %}
    WAIT_TEMP_END
  {% endif %}

[gcode_macro WAIT_TEMP_END]
description: Stop assisted hotend cooling routine
gcode:
  # RESPONSE_INFO PREFIX="[WAIT_TEMP_END]" MSG="Hotend cooled down!"
  UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=0
  M107

[gcode_macro M900]
description: Set pressure advance. K=advance factor, E=extruder number
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M204]
description: OVERRIDE M204: Custom set acceleration if not in Qmode. P=printing moves, T=travel moves, S=default for both
rename_existing: M204.1
gcode:
  {% if printer['gcode_macro Qmode'].flag|int == 0 %}
    {% if 'S' in params|upper %}
      M204.1 S{params.S}
    {% elif 'P' in params|upper and 'T' in params|upper %}
      M204.1 P{params.P} T{params.T}
    {% else %}
      RESPONSE_INFO PREFIX="[M204]" MSG="Invalid parameters. Use S for all or P and T for separate printing and travel acceleration."
    {% endif %}
  {% endif %}

[gcode_macro M205]
description: Set square corner velocity for X or Y axis
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro PRINT_CALIBRATION]
description: Old prtouch calibration routine (Unknown if needed, but included for compatibility with Creality existing scripts)
gcode:
  RESPONSE_INFO PREFIX="[PRINT_CALIBRATION]" MSG="Starting print calibration routine. Please wait..."
  CX_PRINT_LEVELING_CALIBRATION

[gcode_macro INPUTSHAPER]
description: Start input shaper calibration routine (Unknown if needed, but included for compatibility with Creality existing scripts)
gcode:
  RESPONSE_INFO PREFIX="[INPUTSHAPER]" MSG="Starting input shaper calibration. Please wait..."
  G28 Z
  # CALIBRATE_CUT_POS
  G90
  {% if 'X' in params.AXES|upper %}
    SHAPER_CALIBRATE AXIS=X ROLL_CAL=0
  {% elif 'Y' in params.AXES|upper %}
    SHAPER_CALIBRATE AXIS=Y ROLL_CAL=0
  {% else %}
    SHAPER_CALIBRATE ROLL_CAL=0
  {% endif %}
  CXSAVE_CONFIG

[gcode_macro AUTOTUNE_SHAPERS]
description: Autotune input shapers selection
variable_autotune_shapers: 'mzv,zv,ei'
gcode:
  RESPONSE_INFO PREFIX="[AUTOTUNE_SHAPERS]" MSG="Called this function with unknown usage."
