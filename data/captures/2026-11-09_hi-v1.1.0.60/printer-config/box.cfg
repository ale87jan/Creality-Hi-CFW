# Configuration for Creality CFS
# This file contains settings for the box module and filament rack, which are responsible for managing the filament
# cutting and loading operations in the Creality Hi printer. The box module handles the cutting and loading of filament,
# while the filament rack manages the storage and feeding of filament into the printer. These configurations ensure
# proper operation of the filament handling system, including cutting positions, extrusion settings during material
# change, and fan control during flushing operations.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[auto_addr]

[filament_rack]
need_clean_length: 63 # Length for cleaning the external mounted filament
first_clean_length: 66

[box]
bus: serial485
filament_sensor: filament_sensor
pre_cut_pos_x: 240        # X-axis position before blade contact to ensure a vertical cut
pre_cut_pos_y: 130        # Y-axis position before blade contact to ensure a vertical cut
# cut_pos_x: 283.5        # X-axis position for cutting (needs to be calibrated with CALIBRATE_CUT_POS macro)
cut_pos_y: 130            # Y-axis position for cutting
# middle_cut_pos_y:       # Y-axis position for middle cutting (if needed)
retract_len_before_cut: 0 # Retraction length before cutting (reduces filament waste during material change)
Tn_retrude: -20           # Retraction length after cutting to pull filament out of the extruder gear
Tn_retrude_velocity: 600  # Retraction speed
Tn_extrude_temp: 220      # Extrusion temperature
Tn_extrude: 140           # Extrusion length during material change
Tn_extrude_velocity: 360  # Extrusion speed
buffer_empty_len: 30      # Retraction length reserved for the buffer, needs to extrude the reserved length of the buffer (length from cutting inside the extruder to the extruder gear)

clean_left_pos_x: 0           # Position of the left side of the Teflon nozzle cleaning brush (X coordinate)
clean_left_pos_y: 130         # Position of the left side of the Teflon nozzle cleaning brush (Y coordinate)
clean_right_pos_x: -5         # Position of the right side of the Teflon nozzle cleaning brush (X coordinate)
clean_right_pos_y: 130        # Position of the right side of the Teflon nozzle cleaning brush (Y coordinate)
clean_velocity: 12000         # Nozzle cleaning speed
box_need_clean_length:60      # Nozzle cleaning length
box_first_clean_length:70     # First nozzle cleaning length
box_need_clean_length_max:80  # Maximum nozzle cleaning length
box_flush_model_fan_value:50  # Fan speed during flushing

cut_velocity: 15000           # Cutting speed
extrude_pos_x: -18.50         # X-axis position for filament extrusion during filament change/purge operation
extrude_pos_y: 130            # Y-axis position for filament extrusion during filament change/purge operation
has_extrude_pos: 1            # Whether extrusion position is needed, distinguishes between K1_MAX and Creality Hi
safe_pos_y: 130               # Safe Y-axis position
check_cut_pos_x_max: 280      # Maximum X-axis position for cut check
switch_pin: !nozzle_mcu:PB1   # Filament presence detection pin
version: 1
detour_pos_y: 261             # Y-axis detour position from cutting to extrusion
# detour_z: True              # Whether to detour on the Z-axis from cutting to extrusion
detour_y: True                # Whether to detour on the Y-axis from cutting to extrusion
# muticlean :True             # Multiple cleaning
# clean_slowdown :True        # Whether to slow down during cleaning
# anti_wire :True             # Whether to enable anti-stringing function during material change

[gcode_macro GET_MODE]
description: Get and store human-readable mode from T1-T4 in printer['box']
variable_mode_str: ""
gcode:
  {% set tnum = params.T|int %}
  {% if tnum not in [1,2,3,4] %}
    {action_respond_info("Invalid parameter. Use T=1..4")}
  {% else %}
    {% set MODE_ENUM = {"0": "IDLE", "1": "PRELOADING", "2": "PRINTING", "3": "WRAPPERING", "4": "ERR", "5": "TEST"} %}
    {% set box = printer['box'] %}
    {% set key = "T" ~ tnum %}
    {% set raw_mode = box[key]["mode"]|string %}
    {% set mode_str = MODE_ENUM.get(raw_mode, "UNKNOWN") %}
    SET_GCODE_VARIABLE MACRO=GET_MODE VARIABLE=mode_str VALUE="{% raw %}'{{ mode_str }}'{% endraw %}"
    {action_respond_info(key ~ " mode = " ~ mode_str)}
  {% endif %}

[gcode_macro BOX_CHECK_MATERIAL]
description: Check if material is present in the box
gcode:
  RESPONSE_INFO PREFIX="[BOX_CHECK_MATERIAL]" MSG="Checking for material presence in the box..."
  # {% if printer['box'].material_present|lower == 'true' %}
  #   RESPONSE_INFO PREFIX="[BOX_CHECK_MATERIAL]" MSG="Material is present in the box."
  # {% else %}
  #   RESPONSE_INFO PREFIX="[BOX_CHECK_MATERIAL]" MSG="No material detected in the box. Please load material before proceeding."
  # {% endif %}
  BOX_ERROR_CLEAR  # If the box error state is not cleared

[gcode_macro BOX_INFO_REFRESH]
description: Refresh the selected CFS slot information
gcode:
  RESPONSE_INFO PREFIX="[BOX_INFO_REFRESH]" MSG="Refreshing box information..."
  BOX_SET_PRE_LOADING ADDR={params.ADDR} NUM={params.NUM} ACTION=RUN
  M400
  BOX_GET_RFID ADDR={params.ADDR} NUM={params.NUM}
  M400
  BOX_GET_REMAIN_LEN ADDR={params.ADDR} NUM={params.NUM}
  M400

[gcode_macro BOX_LOAD_MATERIAL_WITH_MATERIAL]
description: Load material with material procedures
gcode:
  RESPONSE_INFO PREFIX="[BOX_LOAD_MATERIAL_WITH_MATERIAL]" MSG="Loading box with material..."
  M104
  BOX_CHECK_MATERIAL
  BOX_CUT_MATERIAL
  BOX_SAVE_FAN
  BOX_RETRUDE_MATERIAL_WITH_TNN   # BOX_RETRUDE_MATERIAL
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  BOX_MATERIAL_CHANGE_FLUSH       # BOX_MATERIAL_FLUSH
  BOX_LOAD_MATERIAL_WITH_MATERIAL_END

[gcode_macro BOX_LOAD_MATERIAL_WITH_MATERIAL_END]
description: Load material with material end procedures
gcode:
  RESPONSE_INFO PREFIX="[BOX_LOAD_MATERIAL_WITH_MATERIAL_END]" MSG="Finished loading box with material."
  BOX_RESTORE_FAN
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro BOX_LOAD_MATERIAL_WITHOUT_MATERIAL]
description: Load material without material procedures
gcode:
  RESPONSE_INFO PREFIX="[BOX_LOAD_MATERIAL_WITHOUT_MATERIAL]" MSG="Loading box without material..."
  M104
  BOX_CHECK_MATERIAL
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  BOX_MATERIAL_CHANGE_FLUSH       # BOX_MATERIAL_FLUSH

[gcode_macro BOX_RETRUDE_MATERIAL_WITH_TNN]
description: Retrude material with TNN
rename_existing: _BOX_RETRUDE_MATERIAL_WITH_TNN1
gcode:
  RESPONSE_INFO PREFIX="[BOX_RETRUDE_MATERIAL_WITH_TNN]" MSG="Retruding material with TNN..."
  BOX_SET_TEMP
  BOX_GO_TO_EXTRUDE_POS
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL]
description: Called when calling Retract from the display
gcode:
  RESPONSE_INFO PREFIX="[BOX_QUIT_MATERIAL]" MSG="Quit material procedures..."
  BOX_CHECK_MATERIAL
  BOX_CUT_MATERIAL
  BOX_RETRUDE_MATERIAL_WITH_TNN
  BOX_QUIT_MATERIAL_END

[gcode_macro BOX_QUIT_MATERIAL_END]
description: Retract end procedures
gcode:
  RESPONSE_INFO PREFIX="[BOX_QUIT_MATERIAL_END]" MSG="Finished quit material procedures."
  SET_COOL_TEMP
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro POP_FILAMENT_OUT]
description: Pop filament out in the bin for cleaning
gcode:
  RESPONSE_INFO PREFIX="[POP_FILAMENT_OUT]" MSG="Popping filament out for cleaning..."
  {% set box = printer.configfile.settings['box'] %}
  {% set pos_x = box.extrude_pos_x %}
  M400
  G90
  G0 X10 F12000
  G0 X{pos_x}
  G0 X10
  G0 X{pos_x}
  G0 X10
  G0 X{pos_x}
  G0 X20
