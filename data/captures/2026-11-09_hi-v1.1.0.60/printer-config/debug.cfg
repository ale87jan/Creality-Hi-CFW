# Custom G-code macros for debugging
# These macros are designed to provide additional information about the printer's state and operations. Useful for
# debugging and troubleshooting.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro GET_TOOLHEAD_INFO]
description: Custom macro to get toolhead information
gcode:
  {% set toolhead = printer.toolhead %}
  {action_respond_info("Homed axes: %s \n" % (toolhead.homed_axes))}
  {action_respond_info("Axis min: X%-4.0fY%-4.0fZ%-5.2f"
                       % (toolhead.axis_minimum.x, toolhead.axis_minimum.y, toolhead.axis_minimum.z))}
  {action_respond_info("Axis max: X%-4.0fY%-4.0fZ%-5.2f"
                       % (toolhead.axis_maximum.x, toolhead.axis_maximum.y, toolhead.axis_maximum.z))}
  {action_respond_info("Speed limit: %-5.2f mm/s" % (toolhead.max_velocity))}
  {action_respond_info("Acceleration limit: %-5.2f mm/s²" % (toolhead.max_accel))}
  {action_respond_info("Acceleration to decel limit: %-5.2f mm/s²" % (toolhead.max_accel_to_decel))}
  {action_respond_info("Square corner velocity limit: %-5.2f mm/s" % (toolhead.square_corner_velocity))}

[gcode_macro zLimit_state]
description: Check the status of the Z-axis limit switches
gcode:
  {% if printer["filament_switch_sensor filament_sensor_4"].filament_detected == True %}
    {action_respond_info("zLimit1_state == True")}
  {% else %}
    {action_respond_info("zLimit1_state == false")}
  {% endif %}

  {% if printer["filament_switch_sensor filament_sensor_5"].filament_detected == True %}
    {action_respond_info("zLimit2_state == True")}
  {% else %}
    {action_respond_info("zLimit2_state == false")}
  {% endif %}

[gcode_macro DUMP_VARIABLES]
description: Dump all printer variables for debugging purposes. Can be filtered by providing NAME and VALUE parameters. Set SHOW_CFG=1 to include config variables
gcode:
  {% set filter_name = params.NAME|default('')|string|lower %}
  {% set filter_value = params.VALUE|default('')|string|lower %}
  {% set show_cfg = params.SHOW_CFG|default(0)|int %}

  {% set out = [] %}

  {% for key1 in printer %}
      {% for key2 in printer[key1] %}
          {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
              {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
          {% endif %}
      {% else %}
          {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
              {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
          {% endif %}
      {% endfor %}
  {% endfor %}

  {action_respond_info(out|join("\n"))}
