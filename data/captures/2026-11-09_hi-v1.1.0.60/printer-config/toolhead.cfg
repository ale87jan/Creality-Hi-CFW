# Toolhead configuration file of the Creality Hi printer
# Adjust parameters as needed for your specific printer setup.
# This file is intended to be included in the main printer configuration.
# Nozzle_mcu: chip: GD32F303CBT6
#             version: F018-NOZZLE-V1.0.0

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

# Extruder parameters
[extruder]
max_extrude_cross_section: 80
max_extrude_only_distance: 200.0
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
# Hotend heater and sensor parameters
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
control: pid
pid_Kp: 26.978
pid_Ki: 2.725
pid_Kd: 66.770
min_temp: 0
max_temp: 320

[tmc2208 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
interpolate: false
# MS35776 driver
run_current: 0.37
sense_resistor: 0.3
stealthchop_threshold: 0

# Part cooling fan
[fan]
pin: !nozzle_mcu:PA11
cycle_time: 0.00004
hardware_pwm: false
kick_start_time: 0.100
shutdown_speed: 0
off_below: 0.2
enable_pin: nozzle_mcu:PB6
max_power: 0.5

# Heater fan
[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 50.0

# PRTouch V3 configuration
[prtouch_v3]
z_offset: 0
speed: 5
samples: 3
samples_result: average
samples_tolerance_retries: 10
samples_tolerance: 0.5
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
prth_msg_show: False
# prth_dbg_ippt: 127.0.0.1
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
prth_tmp_comp: 26, 300, 0, 0.20
prth_max_chps: 8
prth_min_fans: 0.65
# prth_gas_calr: 0.001

# Nozzle cleaning
[nozzle_clear]
clear_temp: 170       # Nozzle wiping temperature
touch_gain: 1         # When wiping the nozzle on the heated bed, the trigger pressure at the two positioning points should be higher; this is the threshold ratio
start_pos: 98, 268    # Nozzle wiping start position
extr_enable: false    # Enable fine cleaning
extrude_length: 50    # Extrusion length for fine cleaning
clear_speed: 6000     # Nozzle wiping speed
enable_clear: true    # Enable coarse wiping
start_clear_temp: 175 # Nozzle wiping starting temperature
touch_speed: 15       # Nozzle touch speed
touch_cnt: 4          # Nozzle touch count
pumpback_mm: 3        # Nozzle retraction distance
retract_dist: 2       # Nozzle touch retract distance
clear_start: 148, 268 # Nozzle wiping start position
probe_pos_diff: 0, 0  # Nozzle wiping offset position relative to probe position
clear_lenght: 14, 2   # Nozzle wiping length
upraise: 0.2          # Nozzle wiping lift height
clear_cnt: 10         # Nozzle wiping count
closure_temp: 120     # Nozzle sealing temperature after wiping

# Spool runout sensor
[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !nozzle_mcu:PB15
debounce_delay: 1.0
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    FILAMENT_RUNOUT_FLUSH
  {% endif %}
  BOX_CHECK_MATERIAL_REFILL

# Logo light
[output_pin LED]
pin: nozzle_mcu:PB12
