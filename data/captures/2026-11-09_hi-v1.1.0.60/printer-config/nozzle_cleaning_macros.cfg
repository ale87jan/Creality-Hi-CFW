# Nozzle cleaning macros
# These macros are designed to clean the nozzle before starting printing, which can help to improve print quality and
# reduce the chances of nozzle clogging. Includes routines for both coarse and fine cleaning, as well as a quick wipe
# before printing to ensure the nozzle is clear of any residual filament. The macros can be customized based on the
# specific printer and user preferences.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro _NOZZLE_WIPE_STATS]
description: Internal macro to track nozzle cleaning status. Not intended for direct use.
variable_inside_nozzle_cleaning: 0
variable_nozzle_is_clean: 0
variable_nozzle_already_cleaned: 0
gcode:

[gcode_macro NOZ_CLEAR]
description: Alias for NOZZLE_WIPE. Overrides the original NOZ_CLEAR macro by Creality
rename_existing: _NOZ_CLEAR
gcode:
  {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].inside_nozzle_cleaning|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=1
    {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].nozzle_is_clean|int == 0 %}
      RESPONSE_INFO PREFIX="[NOZ_CLEAR]" MSG="NOZ_CLEAR override for full wipe!"
      NOZZLE_WIPE # Full nozzle wipe and clean routine
    {% else %}
      RESPONSE_INFO PREFIX="[NOZ_CLEAR]" MSG="NOZ_CLEAR override for quick wipe!"
      NOZZLE_QUICK_WIPE # Quick wipe nozzle
    {% endif %}
  {% endif %}

[gcode_macro NOZZLE_CLEAR]
description: Alias for NOZZLE_WIPE. Overrides the original NOZZLE_CLEAR macro by Creality
rename_existing: _NOZZLE_CLEAR
gcode:
  {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].inside_nozzle_cleaning|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=1
    {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].nozzle_is_clean|int == 0 %}
      RESPONSE_INFO PREFIX="[NOZ_CLEAR]" MSG="NOZ_CLEAR override for full wipe!"
      NOZZLE_WIPE # Full nozzle wipe and clean routine
    {% else %}
      RESPONSE_INFO PREFIX="[NOZ_CLEAR]" MSG="NOZ_CLEAR override for quick wipe!"
      NOZZLE_QUICK_WIPE # Quick wipe nozzle
    {% endif %}
  {% endif %}


[gcode_macro NOZZLE_WIPE]
description: Nozzle wipe before start printing. Based on the original macro NOZ_CLEAR by Creality with some optimizations
gcode:
  {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].inside_nozzle_cleaning|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=1

    SAVE_GCODE_STATE NAME=NozzleClearState
    RESPONSE_INFO PREFIX="[NOZZLE_WIPE]" MSG="Starting nozzle cleaning routine..."
    {% set diff_pos_x = range(3)|random %}
    {% set diff_pos_y = range(3)|random %}
    {% set prtouch_v3 = printer.configfile.settings['prtouch_v3'] %}
    {% set nozzle_clear = printer.configfile.settings['nozzle_clear'] %}
    {% set box = printer.configfile.settings['box'] %}
    {% set hotend_target = printer['extruder'].target %}
    {% set x_wait = printer['gcode_macro PRINTER_PARAM'].max_x_position|float / 2 %}
    {% set y_wait = printer['gcode_macro PRINTER_PARAM'].max_y_position|float / 2 %}

    SET_VELOCITY_LIMIT ACCEL={printer.toolhead.max_accel|int}
    SET_VELOCITY_LIMIT VELOCITY={printer.toolhead.max_velocity|int}

    # To prevent interference from residual filament on the nozzle, increase the trigger threshold to avoid triggering on filament
    # {% set old_hold = prtouch_v3.pres_tri_hold|float %}
    # {% set prtouch_v3.pres_tri_hold = nozzle_clear.touch_gain|float * old_hold %}
    # RESPONSE_INFO PREFIX="[NOZZLE_WIPE]" MSG="new tri_hold = {prtouch_v3.pres_tri_hold}"

    M104 S{nozzle_clear.start_clear_temp|float}
    G28 Z # Home Z axis to ensure we are in a known position before starting the cleaning routine

    # Fine cleaning
    {% if nozzle_clear.extr_enable == True and box is defined %}
      RESPONSE_INFO PREFIX="[NOZZLE_WIPE]" MSG="Starting fine cleaning routine..."
      G0 X{box.extrude_pos_x|float} F18000
      M109 S{nozzle_clear.start_clear_temp|float}
      G91
      G0 E{nozzle_clear.extrude_length|float} F400
      G0 E-1 # Retraction
      G90
      M400

      M106 S255
      G4 P1000
      M400

      G0 X10 F18000
      G0 X{box.extrude_pos_x|float}
      G0 X10
    {% endif %}

    G0 X{nozzle_clear.start_pos[0]-diff_pos_y} Y{nozzle_clear.start_pos[1]+diff_pos_x} F18000
    M109 S{nozzle_clear.start_clear_temp|float}
    G91
    G0 E-{nozzle_clear.pumpback_mm|float} # Retraction
    G0 X2 F6000

    {% for cnt in range(nozzle_clear.touch_cnt|int) %}
      {% for cnt2 in range(3) %}
        G90
        PROBE PROBE_SPEED={nozzle_clear.touch_speed|int} SAMPLE_RETRACT_DIST={nozzle_clear.retract_dist|float}
        {% if cnt2 == 2 %}
          G91
          G0 X2 F6000
        {% endif %}
        G91
        G0 Z3 X2 F3000
      {% endfor %}
      G91
      G0 X3 F6000
    {% endfor %}

    G90
    PROBE SAMPLES=1 PROBE_SPEED={nozzle_clear.touch_speed|int} SAMPLE_RETRACT_DIST={nozzle_clear.retract_dist|float}

    # Coarse cleaning
    RESPONSE_INFO PREFIX="[NOZZLE_WIPE]" MSG="Starting coarse cleaning routine..."
    G90
    M106 S255
    M109 S{nozzle_clear.clear_temp|float}
    M104 S0
    M107
    G0 Z3 F300

    {% set check_pos = [nozzle_clear.clear_start[0], nozzle_clear.clear_start[1]] %}
    G0 X{check_pos[0]-20} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}

    PROBE SAMPLES=1 PROBE_SPEED={nozzle_clear.touch_speed|int} SAMPLE_RETRACT_DIST={nozzle_clear.retract_dist|float}
    SET_KINEMATIC_POSITION Z=0

    {% if nozzle_clear.enable_clear == True %}
      G0 X{check_pos[0]} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}
      G91
      G0 X{nozzle_clear.probe_pos_diff[0]} Y{nozzle_clear.probe_pos_diff[1]} F{nozzle_clear.clear_speed|int}
      G0 Z{nozzle_clear.upraise|float} F300
      G90
      G0 F{nozzle_clear.clear_speed|int}
      G91
      {% for i in range(nozzle_clear.clear_cnt|int) %}
        G0 X{nozzle_clear.clear_lenght[0]|int}
        G0 Y{nozzle_clear.clear_lenght[1]|int}
        G0 X-{nozzle_clear.clear_lenght[0]|int}
        G0 Y-{nozzle_clear.clear_lenght[1]|int}
      {% endfor %}
    {% endif %}

    # After wiping, raise back to the light platform to seal the nozzle
    G0 Z5 F300

    G90
    G0 X{check_pos[0]-20} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}
    PROBE SAMPLES=1 PROBE_SPEED={nozzle_clear.touch_speed|int} SAMPLE_RETRACT_DIST={nozzle_clear.retract_dist|float}
    SET_KINEMATIC_POSITION Z=0

    # Seal the nozzle and cool down to 120
    M106 S255
    M109 S{nozzle_clear.closure_temp|float}
    M107

    # After wiping, raise back to the heated bed
    G0 Z10 F300
    G0 X{x_wait} Y{y_wait} F6000

    # Restore hotend temp to target after cleaning
    M104 S{hotend_target}

    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=nozzle_is_clean VALUE=1

    RESTORE_GCODE_STATE NAME=NozzleClearState

    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=0
  {% endif %}

[gcode_macro NOZZLE_QUICK_WIPE]
description: Quick nozzle wipe before start printing. Only performs a few probe touches to quickly clean the nozzle without the full cleaning routine. Useful for quick prints or when the printer has been recently used and the nozzle is likely still clean
gcode:
  {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].inside_nozzle_cleaning|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=1

    SAVE_GCODE_STATE NAME=NozzleClearState
    RESPONSE_INFO PREFIX="[NOZZLE_QUICK_WIPE]" MSG="Starting quick nozzle cleaning routine..."

    {% set diff_pos_x = range(3)|random %}
    {% set diff_pos_y = range(3)|random %}
    {% set nozzle_clear = printer.configfile.settings['nozzle_clear'] %}
    {% set hotend_target = printer['extruder'].target %}
    {% set x_wait = printer['gcode_macro PRINTER_PARAM'].max_x_position|float / 2 %}
    {% set y_wait = printer['gcode_macro PRINTER_PARAM'].max_y_position|float / 2 %}
    {% set check_pos = [nozzle_clear.clear_start[0], nozzle_clear.clear_start[1]] %}

    SET_VELOCITY_LIMIT ACCEL={printer.toolhead.max_accel|int}
    SET_VELOCITY_LIMIT VELOCITY={printer.toolhead.max_velocity|int}

    M104 S{nozzle_clear.clear_temp|float}
    G28 Z # Home Z axis to ensure we are in a known position before starting the cleaning routine

    G0 X{check_pos[0]-20} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}

    M109 S{nozzle_clear.clear_temp|float}

    G91
    G0 E-{nozzle_clear.pumpback_mm|float} # Retraction

    # Perform a few probe touches to quickly clean the nozzle without the full cleaning routine
    G90
    PROBE SAMPLES={nozzle_clear.touch_cnt|default(3)|int} PROBE_SPEED={nozzle_clear.touch_speed|int} SAMPLE_RETRACT_DIST={nozzle_clear.retract_dist|float}
    SET_KINEMATIC_POSITION Z=0

    G91
    G0 Z{nozzle_clear.upraise|float} F300

    G90
    G0 X{check_pos[0]} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}

    # Wipe the nozzle with a quick back-and-forth motion to remove any residual filament after the probe touches
    G91
    {% for i in range(nozzle_clear.clear_cnt|int) %}
      G0 X{nozzle_clear.clear_lenght[0]|int}
      G0 Y{nozzle_clear.clear_lenght[1]|int}
      G0 X-{nozzle_clear.clear_lenght[0]|int}
      G0 Y-{nozzle_clear.clear_lenght[1]|int}
    {% endfor %}

    # After wiping, raise back and probe again to ensure the nozzle is clear and to reset the Z position
    G0 Z5 F300

    G90
    G0 X{check_pos[0]-20} Y{check_pos[1]} F{nozzle_clear.clear_speed|int}
    PROBE
    SET_KINEMATIC_POSITION Z=0

    # Restore hotend temperature
    M104 S{hotend_target}

    # Go to the center of the bed after cleaning
    G0 Z10 F300
    G0 X{x_wait} Y{y_wait} F6000

    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=nozzle_is_clean VALUE=1

    RESTORE_GCODE_STATE NAME=NozzleClearState

    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE_STATS VARIABLE=inside_nozzle_cleaning VALUE=0
  {% endif %}
