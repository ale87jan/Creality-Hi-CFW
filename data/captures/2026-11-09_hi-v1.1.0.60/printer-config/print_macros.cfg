# Custom print lifecycle management
# Macros to manage the print lifecycle, including starting, pausing, resuming, and canceling prints, with CFS
# integration and error handling.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro _START_PRINT_VARS]
description: Variables for START_PRINT macro
# Z offset variables for different materials
variable_offset_PLA: 0        # Z offset for PLA material
variable_offset_PETG: 0       # Z offset for PETG material
variable_offset_ABS: 0        # Z offset for ABS material
variable_offset_DEFAULT: 0    # Default offset if material is not recognized
variable_offset_PROBE: 1      # If set to 1, do not adjust Z offset based on material
variable_heat_soak: 5         # Time to wait for heat soak before printing (minutes)
variable_purge_adaptative: 1  # Type of purge line to print at the start of the print (0-5)
gcode:
  {action_respond_info("Listing START_PRINT_VARS...")}
  {% for var, value in printer["gcode_macro _START_PRINT_VARS"].items() %}
    {action_respond_info(var ~ ": " ~ value)}
  {% endfor %}

[gcode_macro _PURGE_LINE]
description: Adaptive purge with different patterns and positions to optimize filament flow and reduce waste
# More information https://www.printables.com/model/1035759-adaptive-purge-for-any-3d-printer-using-slicer-var/files
# 0: Full purge line at the front of the bed
# 1: Automatic purge line based on the first layer dimensions with different positions and orientations
# 2: Triangle purge line at the lower left of the first layer
gcode:
  # Get coordinates for the purge line based on the first layer dimensions
  {% set x0 = params.PRINT_AREA.split(",")[0]|default(-1)|float %}
  {% set y0 = params.PRINT_AREA.split(",")[1]|default(-1)|float %}
  {% set x1 = params.PRINT_AREA.split(",")[2]|default(-1)|float %}
  {% set y1 = params.PRINT_AREA.split(",")[3]|default(-1)|float %}
  {% set x_max = printer['gcode_macro PRINTER_PARAM'].max_x_position|float %}
  {% set y_max = printer['gcode_macro PRINTER_PARAM'].max_y_position|float %}
  {% set purge_selected = printer['gcode_macro _START_PRINT_VARS'].purge_adaptative %}

  # RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="ADAPTATIVE PURGE LINE: Recieved coordinates X0={x0} Y0={y0} X1={x1} Y1={y1}"
  M204 S2000
  G1 Z3 F600
  M83         # Relative extrusion mode
  G92 E0      # Reset extruder

  # If purge_selected is 0 or any of the coordinates are missing or invalid, do a full purge line at the front
  {% if purge_selected == 0 or [x0, y0, x1, y1]|min == -1 %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Full purge line at the front of the bed"
    G1 X0 Y0 F12000         # Move to front left corner of the bed
    G1 Z0.2 F600
    G1 X260 Y0 E30 F6000    # Extrude a purge line across the front of the bed
    G1 Y-0.2 F6000
    G1 X10 Y-0.2 E30 F6000  # Extrude a small purge line back to the front left corner
    G92 E0                  # Reset extruder
    G1 E-0.5 F2100          # Small retraction
    G1 X0 F6000             # Move an additional 10mm without extruding
  {% elif purge_selected == 1 %}
    {% if x0 - 10 > 0 %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Vertical Lower Left"
      G1 X{x0 - 10} Y{y0} Z0.8 F6000      # Position 10mm left of print
      G1 X{x0 - 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the Y direction
      G92 E0
      G1 E-0.5 F2100        # Small retraction
      G1 Y{y0 + 40} F6000   # Move an additional 10mm without extruding
    {% elif y0 - 10 > 0 %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Horizontal Lower Left"
      G1 X{x0} Y{y0 - 10} Z0.8 F6000      # Position 10mm front of print
      G1 X{x0 + 30} Y{y0 - 10} E30 F360   # Extrude 30mm of filament in the x direction
      G92 E0                # Reset extruder
      G1 E-0.5 F2100        # Small retraction
      G1 X{x0 + 40} F6000   # Move an additional 10mm without extruding
    {% elif x1 + 10 < x_max %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Vertical Upper Right"
      G1 X{x1 + 10} Y{y0} Z0.8 F6000      # Position 10mm right of print
      G1 X{x1 + 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the y direction
      G92 E0 # Reset extruder
      G1 E-0.5 F2100 # Small retraction
      G1 Y{y0 + 40} F6000 # Move an additional 10mm without extruding
    {% elif y1 + 10 < y_max %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Horizontal Upper Right"
      G1 X{x0} Y{y1 + 10} Z0.8 F6000 # Position 10mm back of print
      G1 X{x0 + 30} Y{y1 + 10} E30 F360 # Extrude 30mm of filament in the x direction
      G92 E0 # Reset extruder
      G1 E-0.5 F2100 # Small retraction
      G1 X{x0 + 40} F6000 # Move an additional 10mm without extruding
    {% else %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Not enough space around the print to do a quick wipe, skipping purge line."
    {% endif %}
  {% elif purge_selected == 2 %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Triangle Lower Left"
    G92 E0
    G1 X{x0 - 10} Y{y0} Z0.8 F6000    # Position 10mm left from the lower left of the first layer
    G1 X{x0 - 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the y direction
    G92 E0
    G1 X{x0 - 30} Y{y0 + 15} E30 F360   # Extrude 30mm of filament in both the x and y direction
    G92 E0
    G1 X{x0 - 10} Y{y0} E30 F360      # Extrude 30mm of filament returning back to the start
    G92 E0
    G1 E-0.5 F2100                    # Small retraction
    G1 X{x0 - 10} Y{y0 - 10} F6000      # Move an additional 10mm without extruding
  {% else %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Invalid purge_adaptative value: {purge_selected}. No purge line will be printed."
  {% endif %}

  G92 E0    # Reset extruder
  G1 Z3 F600
  # RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="PURGE_LINE: Finished adaptative purge line..."

[gcode_macro START_PRINT]
description: Prepare and start a print with specified temperatures
# Example usage: START_PRINT EXTRUDER_TEMP=220 BED_TEMP=60
variable_prepare: 0
variable_nozzle_is_clean: 0
gcode:
  RESPONSE_INFO PREFIX="[START_PRINT]" MSG="{rawparams}"

  # Cancel any pending delayed box end commands to prevent them from executing during the start of a new print
  CANCEL_DELAYED_BOX_END
  WAIT_TEMP_END           # Ensure any previous cooldown processes are finished before starting a new print

  BOX_ERROR_CLEAR
  BOX_START_PRINT   # CFS start print macro
  G90               # Use absolute positioning

  BED_MESH_CLEAR

  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set EXTRUDER_WAITTEMP = (printer.custom_macro.g28_ext_temp|float)|int %}
  # {% set MATERIAL = params.MATERIAL|default("")|string %}

  # Start bed heating to slightly below target to avoid overshoot with the _SMART_BED_MONITOR
  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting bed to {BED_TEMP - 10}°C..."
  # M140 S{BED_TEMP - 10}

  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting nozzle to {EXTRUDER_WAITTEMP}°C..."
  M104 S{EXTRUDER_WAITTEMP}

  # Disabled Z offset adjustment based on material
  # {% if printer['gcode_macro _START_PRINT_VARS'].offset_probe == 1 %}
  #   RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Not adjusting Z offset relying on probe..."
  # {% else %}
  #   {% if MATERIAL == 'PLA' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_pla %}
  #   {% elif MATERIAL == 'PETG' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_petg %}
  #   {% elif MATERIAL == 'ABS' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_abs  %}
  #   {% else %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_default %}
  #   {% endif %}

  #   RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting Z offset for {MATERIAL} of {OFFSET} ..."
  #   SET_GCODE_OFFSET Z={OFFSET}
  # {% endif %}

  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Waiting for bed to reach {BED_TEMP}°C..."
  M190 S{BED_TEMP}

  _MESH_IF_NEEDED BED_TEMP={BED_TEMP}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Printer not prepared. Do homing and clean the nozzle..."
    IF_XY_NEED_HOME

    # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Clean nozzle before print start"
    {% if printer['gcode_macro _NOZZLE_WIPE_STATS'].nozzle_is_clean|int == 0 %}
      NOZZLE_WIPE # Full nozzle wipe and clean routine
    {% else %}
      NOZZLE_QUICK_WIPE # Quick wipe nozzle
    {% endif %}

    # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Waiting for nozzle to reach {EXTRUDER_WAITTEMP}°C..."
    M109 S{EXTRUDER_WAITTEMP}

    # Perform photoelectric leveling once after fine wiping the nozzle to obtain the maximum Z-axis height value.
    # Each time the leveling is performed, Z_TILT_ADJUST must be re-performed to obtain new adjustments.
    ZDOWN_SWITCH ENABLE=1
    G28 Z
    # Z_TILT_ADJUST       # Perform Z tilt adjustment to get new stepper motor adjustments
    ZDOWN_SWITCH ENABLE=0 # Disable photoelectric leveling

    NEXT_HOMEZ_NACCU      # Set coarse detection mode for the next Z-axis homing
    G28 Z

    PRINT_PREPARED

  {% else %}
    RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Printer prepared. Skipping preparation..."
  {% endif %}

  BOX_GO_TO_EXTRUDE_POS # M1500
  M190 S{BED_TEMP}      # Ensure bed is at target temp before starting (in case it cooled down)
  M109 S{EXTRUDER_TEMP} # Wait nozzle heating

  M220 S100 # Reset Feedrate
  M221 S100 # Reset Flowrate
  G21       # Set units to millimeters
  G92 E0    # Reset extruder

  RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Starting print now!"

[gcode_macro END_PRINT]
description: End the actual printing process
gcode:
  RESPONSE_INFO PREFIX="[END_PRINT]" MSG="Finishing print..."
  ENABLE_PRESSURE_ADVANCE VALUE=1

  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z + 50 > 300 %}
    {% set pos_z = 300 %}
  {% else %}
    {% set pos_z = printer.toolhead.position.z|float + 50 %}
  {% endif %}

  G1 Z{pos_z} F3000 # Move Z to a safe height
  FORCE_MOVE_E E=-4 # Retract filament to reduce oozing while cooling down

  # Set a delayed gcode to end the box and disable motors after 30 minutes of idle time
  UPDATE_DELAYED_GCODE ID=DELAYED_BOX_END DURATION=1800

  G1 X0 Y260 F3000  # Move bed to front
  TURN_OFF_HEATERS  # Turn off heaters
  WAIT_TEMP_START   # Start assistend hotend cooldown

  BOX_END_PRINT # Ends the print in the CFS, if not already ended by BOX_END

  RESPONSE_INFO PREFIX="[END_PRINT]" MSG="You could retrieve the print from the bed once it has cooled down."

[delayed_gcode DELAYED_BOX_END]
# description: Send BOX_END and BOX_END_PRINT to the CFS and disable motors after idle timeout when print is finished
initial_duration: 0
gcode:
  # RESPONSE_INFO PREFIX="[DELAYED_BOX_END]" MSG="Finished print timeout reached. Retrude filament to CFS and disable motors."
  BOX_END       # Purges the filament and retrudes it back to the box, also ends the print in the CFS
  # BOX_END_PRINT # Ends the print in the CFS, if not already ended by BOX_END
  M84           # Disable motors

[gcode_macro CANCEL_DELAYED_BOX_END]
description: Cancel the DELAYED_BOX_END command when a new print starts or when the print is canceled to avoid unintended BOX_END commands
gcode:
  # RESPONSE_INFO PREFIX="[CANCEL_DELAYED_BOX_END]" MSG="Canceling delayed box end."
  UPDATE_DELAYED_GCODE ID=DELAYED_BOX_END DURATION=0

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: _CANCEL_PRINT_BASE
variable_inside_cancel: 0
gcode:
  ENABLE_PRESSURE_ADVANCE VALUE=1
  RESPONSE_INFO PREFIX="[CANCEL_PRINT]" MSG="Canceling print..."

  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=inside_cancel VALUE=1

  {% set act_z = printer.toolhead.position.z|float %}
  # Calculate safe Z position
  {% if act_z + 50 > 305 %}
    {% set pos_z = 305 %}
  {% else %}
    {% set pos_z = printer.toolhead.position.z|float + 50 %}
  {% endif %}

  # Move Z to safe height or home XY if not homed
  {% set homed_axes = ({"X": printer['gcode_macro xyz_ready'].x_ready|int == 1,
                        "Y": printer['gcode_macro xyz_ready'].y_ready|int == 1,
                        "Z": printer['gcode_macro xyz_ready'].z_ready|int == 1}) %}

  {% if homed_axes["X"] == 0 or homed_axes["Y"] == 0 or homed_axes["Z"] == 0 %}
    G28 X Y
  {% else %}
    G90
    G1 Z{pos_z} F1200
  {% endif %}

  _CANCEL_PRINT_BASE
  # BOX_MOVE_TO_CUT
  PAUSE_CUT
  # BOX_END
  FORCE_MOVE_E E=-4
  TURN_OFF_HEATERS

  G1 F3000 X10 Y260 # Move bed to front
  M400              # Wait for moves to finish
  WAIT_TEMP_START   # Start waiting for hotend to cool down with part fan assistance
  M84               # Disable motors

  FINISH_INIT
  BOX_END_PRINT

  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=inside_cancel VALUE=0

  RESPONSE_INFO PREFIX="[CANCEL_PRINT]" MSG="Print canceled."

[gcode_macro MOTOR_CANCEL_PRINT]
description: Cancel print due to motor error
gcode:
  RESPONSE_INFO PREFIX="[MOTOR_CANCEL_PRINT]" MSG="Error detected, canceling print..."
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  M220 S100
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
  TURN_OFF_HEATERS
  WAIT_TEMP_START     # Start waiting for hotend to cool down with part fan assistance
  BOX_SET_CURRENT_BOX_IDLE_MODE
  _CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Override PAUSE macro to add external process
rename_existing: _PAUSE_BASE
variable_extrude: 2.0 # change this if you need more or less extrusion
gcode:
  RESPONSE_INFO PREFIX="[PAUSE]" MSG="Pausing print..."
  {% if printer.pause_resume.is_paused|lower == 'false' %}
    _PAUSE_BASE
    _PAUSE_EXTERNAL
  {% endif %}

[gcode_macro _PAUSE_EXTERNAL]
description: PAUSE macro external process
gcode:
  {% set inside_cancel = printer['gcode_macro CANCEL_PRINT'].inside_cancel|int %}
  RESPONSE_INFO PREFIX="[PAUSE]" MSG="inside_cancel: {inside_cancel}."
  {% if printer['print_stats'].state|lower == 'cancelled' %}
    RESPONSE_INFO PREFIX="[PAUSE]" MSG="Printer state is not printing."
  {% elif printer['gcode_macro CANCEL_PRINT'].inside_cancel|int == 1 %}
    RESPONSE_INFO PREFIX="[PAUSE]" MSG="Printer is canceling, no need to pause."
  {% else %}
    RESPONSE_INFO PREFIX="[PAUSE]" MSG="Printer is pausing..."
    # Read E from pause macro
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    # Set park position for x and y
    # default is your max position from your printer.cfg
    # {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    # {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}

    # Calculate safe lift position
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < 48.0 %}
      {% set z_safe = 50.0 - act_z %}
    {% elif act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
    {% else %}
      {% set z_safe = max_z - act_z %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan_speed VALUE={printer.fan.speed * 255}

    {% if printer.extruder.can_extrude|lower == 'true' %} # Only retract if the extruder is hot enough
      G91
      G1 E-1.0 F180
      G1 E-{E} F360
      G90
    {% else %}
      RESPONSE_INFO PREFIX="[PAUSE]" MSG="Extruder not hot enough. Skipping retraction."
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %} # Only move if the printer is homed
      G91
      G1 Z{z_safe} F600
      G90
      M400
      IF_CUT_AND_COOLING
    {% else %}
      RESPONSE_INFO PREFIX="[PAUSE]" MSG="Printer not homed. Not moving to park position to cut and cool."
    {% endif %}
  {% endif %}

  BOX_TIGHTEN_UP_ENABLE ENABLE=ENABLE

[gcode_macro RESUME]
description: Override RESUME macro to add error check
rename_existing: _RESUME_BASE
gcode:
  RESPONSE_INFO PREFIX="[RESUME]" MSG="Resuming print..."
  RESUME_BOX_ERROR_CLEAR
  _RESUME_EXTERNAL_PROCESS
  _RESUME_BASE {get_params}

[gcode_macro _RESUME_EXTERNAL_PROCESS]
description: Resume the current print external process with error check
gcode:
  BOX_ERROR_RESUME_PROCESS
  _RESUME_EXTERNAL

[gcode_macro _RESUME_EXTERNAL]
description: Resume the current print external process
gcode:
  {% if printer.pause_resume.resume_err is none or printer.pause_resume.resume_err|lower == 'false' %}
    SET_GCODE_VARIABLE MACRO=IF_CUT_AND_COOLING VARIABLE=resumed VALUE=1
    {% if printer['gcode_macro PRINTER_PARAM'].hotend_temp|int != 0 %}
      {% if printer['gcode_macro PRINTER_PARAM'].hotend_temp|int > printer.extruder.temperature %}
        M109 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int} # Wait for hotend to reach target temp before resuming
      {% else %}
        M104 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int} # Set hotend to target temp without waiting
      {% endif %}
      SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0 # Clear saved hotend temp
    {% endif %}

    # Read extra extrude length from PAUSE macro
    {% set E = printer["gcode_macro PAUSE"].extrude|float + 60.0 %}

    # Get VELOCITY parameter if specified
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}

    {% set z_resume_move = printer['gcode_macro PRINTER_PARAM'].z_safe_pause|int %}
    {% if z_resume_move > 2 %}
      {% set z_resume_move = z_resume_move - 2 %}
      G91
      G1 Z-{z_resume_move} F600
      M400
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE=0 # Clear saved z safe pause

    {% if printer.extruder.can_extrude|lower == 'false' %}
      RESPONSE_INFO PREFIX="[RESUME]" MSG="Extruder not hot enough. Waiting for hotend to reach target temperature..."
      M109 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
    {% else %}
      M104 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
    {% endif %}

    {% if printer['gcode_macro PRINTER_PARAM'].hotend_temp|int > printer.extruder.temperature %}
      IF_XY_NEED_HOME
      BOX_GO_TO_EXTRUDE_POS
      # G91
      # G1 E{E} F180
      RESUME_FLUSH LENGTH={E}
      M400
      BOX_NOZZLE_CLEAN
      M109 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
    {% else %}
      RESPONSE_INFO PREFIX="[RESUME]" MSG="Extruder not hot enough. Skipping extrusion."
    {% endif %}

    # Restore fan speed (value saved before pause)
    {% if printer['gcode_macro PRINTER_PARAM'].fan_speed > 0 %}
      {% set s_value = (printer['gcode_macro PRINTER_PARAM'].fan_speed|int) %}
      M106 S{s_value}
      SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan_speed VALUE=0 # Clear saved fan speed
    {% endif %}

    BOX_TIGHTEN_UP_ENABLE ENABLE=DISABLE
  {% endif %}

[gcode_macro FIRST_FLOOR_PAUSE]
description: Pause the first floor print
variable_extrude: 2.0 # Change this if you need more or less extrusion on pause to prevent oozing during long pauses
gcode:
  # Read extrude length from FIRST_FLOOR_PAUSE macro
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float %}

  # Set park positon for x and y (default is your max posion from your printer.cfg)
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}

  # Calculate z_safe position to move up during pause to prevent nozzle from hitting the print
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 0.0 %}
  {% if act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% elif act_z < max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
  _PAUSE_BASE

  G91
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      RESPONSE_INFO PREFIX="[FIRST_FLOOR_PAUSE]" MSG="Extruder not hot enough. Skipping retraction."
    {% endif %}
    G1 Z{z_safe} F600
    G90
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    RESPONSE_INFO PREFIX="[FIRST_FLOOR_PAUSE]" MSG="Printer not homed. Not moving to park position."
  {% endif %}

[gcode_macro FIRST_FLOOR_PAUSE_POSITION]
description: Move to a safe position for first floor pause
gcode:
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  M104 S{extruder_temp}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer['gcode_macro PRINTER_PARAM'].max_x_position|float + 1 %}
  G90
  G1 Z2 F600
  G1 X{x_park} Y{y_park} F6000
  G1 Z0.2 F600

[gcode_macro FIRST_FLOOR_RESUME]
description: Resume the first floor print
gcode:
  # Read extra extrude length from FIRST_FLOOR_PAUSE macro
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float + 1.0 %}
  # Get VELOCITY parameter if specified
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    RESPONSE_INFO PREFIX="[FIRST_FLOOR_RESUME]" MSG="Extruder not hot enough. Skipping extrusion."
  {% endif %}

  _RESUME_BASE {get_params} # Resume the print with optional velocity parameter

[gcode_macro PRINT_PREPARED]
description: Set the prepare flag of START_PRINT macro
gcode:
  RESPONSE_INFO PREFIX="[PRINT_PREPARED]" MSG="Set printer prepared flag"
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=1

[gcode_macro PRINT_PREPARE_CLEAR]
description: Clear the prepare flag of START_PRINT macro
gcode:
  RESPONSE_INFO PREFIX="[PRINT_PREPARE_CLEAR]" MSG="Clear printer prepared flag"
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

  # Clear XYZ ready variables to force homing after flag is cleared
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=0
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=0

[gcode_macro FINISH_INIT]
description: Finish the initialization process
gcode:
  RESPONSE_INFO PREFIX="[FINISH_INIT]" MSG="Finishing initialization and restoring settings..."

  {% set extruder = printer.configfile.settings['extruder'] %}
  {% set printer = printer.configfile.settings['printer'] %}
  SET_PRESSURE_ADVANCE ADVANCE={extruder.pressure_advance}
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer.max_accel_to_decel|int}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.square_corner_velocity|int}
  SET_VELOCITY_LIMIT ACCEL={printer.max_accel|int}
  SET_VELOCITY_LIMIT VELOCITY={printer.max_velocity|int}
  M220 S100 # Restore movement speed
  M221 S100 # Restore extrusion speed

[gcode_macro PRINT_TEMP_SET]
description: Prepare print temperature settings (Unknown if needed. May be used in Creality touchscreen macros, but included for compatibility with Creality existing scripts)
