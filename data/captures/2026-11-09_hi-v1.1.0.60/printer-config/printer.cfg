# F018
# Printer_size: 260x260x300
# Version: v1.0.73
# CreateDate: 2025/02/08
# Nozzle_mcu: chip: GD32F303CBT6
#             version: F018-NOZZLE-V1.0.0
# Leveling_mcu: chip: GD32E230F8P6
#             version: F018-LEVELING-V1.0.0
# mcu: chip: GD32F303RET6
#      version: CR4CU220812S12

# Main Klipper Configuration File for the Creality Hi printer (F018_CR4NU200360C20)
# Common pin mappings and settings for the printer are defined here, while specific configurations for sensors, motors,
# and custom gcode_macros are included from separate files for better organization and maintainability.

# Based on the original firmware from Creality
# Version: v1.1.0.60
# CreateDate: 2025/06/19

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[include miscellaneous.cfg]
[include sensorless.cfg]
[include multimaterial.cfg]
[include printer_params.cfg]
[include box.cfg]
[include motor_control.cfg]
[include toolhead.cfg]
[include custom_mesh.cfg]
[include config_macros.cfg]
[include print_macros.cfg]
[include print_modes.cfg]
[include nozzle_cleaning_macros.cfg]
[include debug.cfg]

# Main MCU
[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

# Main MCU temperature sensor
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# Raspberry Pi MCU
[mcu rpi]
serial: /tmp/klipper_host_mcu

# Raspberry Pi temperature sensor
# [temperature_sensor temperature_host]
# sensor_type: temperature_host

# I2C EEPROM
[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.1
i2c_speed: 400000

# Nozzle MCU
[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

# Nozzle heater verification
[verify_heater extruder]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 2

[mcu bed_mcu] # Bed leveling MCU
serial: /dev/ttyS4
baud: 230400
restart_method: command

# Idle time (in seconds) to wait before running the following G-Code commands
[idle_timeout]
# Default "TURN_OFF_HEATERS" and disable steppers using "M84".
timeout: 600
gcode:
  RESPONSE_INFO PREFIX="[IDLE_TIMEOUT]" MSG="Idle timeout reached, turning off heaters."
  TURN_OFF_HEATERS

# Virtual SD Card path
[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

# Save variables to file
# [save_variables]
# filename: "/mnt/UDISK/printer_data/config/variables.cfg"

[respond]

[pause_resume]

[display_status]

[exclude_object]

[gcode_arcs]
resolution: 1.0

[io_remap]
src_pin: PB0      # Input pin (being remapped)
remap_pin: PA15   # Output pin (remapped)
src_pullup: 1     # Pull-up configuration
remap_def: 1      # Default output pin level
filterNum: 1      # Valid level if duration is greater than or equal to filterNum * periodTicks
periodTicks: 0    # Polling period

[stepper_x]
step_pin: PB10
dir_pin: !PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: !PC7
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: -6
position_min: -6
position_max: 274
homing_speed: 30
homing_retract_dist: 10
second_homing_speed: 10

# Resonance compensation
[lis2dw x]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[lis2dw y]
cs_pin: bed_mcu:PA4
spi_speed: 5000000
axes_map: y,x,z
spi_software_sclk_pin: bed_mcu:PA5
spi_software_mosi_pin: bed_mcu:PA7
spi_software_miso_pin: bed_mcu:PA6

[resonance_tester]
accel_chip_x: lis2dw x
accel_chip_y: lis2dw y
max_freq: 90
accel_per_hz: 75
probe_points: 130,130,100

# Bed leveling configuration
[bed_mesh]
speed: 20
horizontal_move_z: 3
mesh_min: 10, 10
mesh_max: 250, 250
probe_count: 9, 9
fade_start: 5.0
fade_end: 10.0
split_delta_z: 0.01
move_check_distance: 1
algorithm: bicubic
relative_reference_index: 40 # (130, 130)
# adaptive_margin: 5

[stepper_z]
step_pin: PB4
dir_pin: PA5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# position_endstop: 0.0
position_max: 310
position_min: -5
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5.0

[stepper_z1]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance:8

[tmc2208 stepper_z]
uart_pin: PC2
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999 # Silent mode

[tmc2208 stepper_z1]
uart_pin: PA4
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 99999999 # Silent mode

# Z tilt configuration
[z_tilt]
z_positions:  20, 130
             240, 130
points: 20, 130
       240, 130
speed: 50
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

# Upward alignment
[z_align]
quick_speed: 20       # Descending speed (mm/s)
slow_speed: 5         # Detection speed (mm/s)
rising_dist: 5        # Distance to rise after first detecting the photoelectric sensor (mm)
safe_rising_dist: 15  # Safe lifting height (mm)
filter_cnt: 10        # Number of consecutive limit switch triggers used for filtering
timeout: 30           # Single detection timeout (s)
retries: 7            # Retry attempts
retry_tolerance: 10   # Maximum allowed deviation for adjustment between two photoelectric sensors, 10 steps with a step size of 0.0025mm
endstop_pin_z: PB15   # Photoelectric trigger
endstop_pin_z1: PB14  # Photoelectric trigger
zd_up: 0              # Stepper motor level away from limit switch
zes_untrig: 0         # Level when limit switch is not triggered
diff_z_offset: 0.5    # Power-off resume suspension difference compensation. Decrease this value when pressing layers, increase it when suspended

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
max_power: 1.0
control: pid
pid_kp: 15.0
pid_ki: 0.01
pid_kd: 900.0
min_temp: 0
max_temp: 115
temp_offset_flag: True
adc_temp_list:    25, 40, 53, 69, 83, 108
actual_temp_list: 25, 38, 50, 65, 80, 110

# Power calibration settings
power_calibration_enable: 0                     # Enable power calibration
power_calibration_wait_even_heating_time: 0     # Preheat time (s)
power_calibration_start_temp: 60                # Start calibration target temperature
power_calibration_end_temp: 100                  # End calibration target temperature
power_calibration_sample_interval: 0.1          # Temperature sampling interval (s)
power_calibration_sample_end_temp_offset: 10    # Calibration end sampling temperature offset
power_calibration_sample_start_temp_offset: 10  # Calibration start sampling temperature offset
power_calibration_max_calibrate_times: 10       # Maximum calibration attempts
power_calibration_retry_times: 3                # Calibration retry attempts
power_calibration_heating_slope_low: 0.45       # Slope range > low ℃/s
power_calibration_heating_slope_high: 0.67      # Slope range < high ℃/s
power_calibration_power_220: 0.75               # Power configuration for 220V
power_calibration_power_110: 1                  # Power configuration for 110V
power_calibration_full_power_110_220_slop_divide: 0.25  # Power slope division between 110V and 220V

# Bed heater verification
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 5

# Z-axis motor line detection
[tmc_line_check]

# Backplane fan NOT CONNECTED
[output_pin board_fan]
pin: !PA0

[duplicate_pin_override]
pins: PA8,PA6,PB13,PA10,PB9,PB10,PB7,PB8,PB4,PA5,PB6,PB5,PA11

# Unknown purpose
[filament_switch_sensor filament_sensor_2]
pause_on_runout: false
switch_pin: PB12

# Unknown purpose
[filament_switch_sensor filament_sensor_3]
pause_on_runout: false
switch_pin: PB13

# zLimit 1
[filament_switch_sensor filament_sensor_4]
pause_on_runout: false
switch_pin: PB14

# zLimit2
[filament_switch_sensor filament_sensor_5]
pause_on_runout: false
switch_pin: PB15

[timer_read]
interval: 0.1
print_interval: 0.1
extruder_interval: 1.0
