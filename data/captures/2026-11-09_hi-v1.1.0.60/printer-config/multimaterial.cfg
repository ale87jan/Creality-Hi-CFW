# Multimaterial macros for Creality Hi
# Material load/unload workflows with automatic nozzle cleaning, CFS filament cutting and thermal cooling cycles,
# pre-print extrusion, and conditional cut-and-cool logic for seamless multi-material printing.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro M600]
description: Manual filament changing gcode
gcode:
  RESPONSE_INFO PREFIX="[M600]" MSG="Manual filament change initiated. Please follow the instructions on the printer display."
  PAUSE
  {% set act_e = printer.toolhead.position.e|float %}
  G91
  G1 E20 F180
  G1 E-30 F180
  G1 E-50 F600
  G90
  G92 E{act_e}

[gcode_macro CALIBRATE_CUT_POS]
description: Calibrate cut position
gcode:
  RESPONSE_INFO PREFIX="[CALIBRATE_CUT_POS]" MSG="Starting cut position calibration..."
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SET_LIMITS
  MOTOR_CHECK_CUT_POS
  M400
  RESTORE_LIMITS

[delayed_gcode DELAY_DISABLE_EXTRUDER]
# description: Delayed disable extruder motor after load or quit material
gcode:
  RESPONSE_INFO PREFIX="[DELAY_DISABLE_EXTRUDER]" MSG="Disabling extruder motor..."
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro LOAD_MATERIAL]
description: Load material from spool holder with automatic cleaning and cooling
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  RESPONSE_INFO PREFIX="[LOAD_MATERIAL]" MSG="Start loading material..."
  IF_XY_NEED_HOME
  BOX_GO_TO_EXTRUDE_POS
  FILAMENT_RACK_SAVE_FAN
  FILAMENT_RACK_PRE_FLUSH
  FILAMENT_RACK_SET_TEMP
  FILAMENT_RACK_FLUSH
  FILAMENT_RACK_RESTORE_FAN
  SET_COOL_TEMP
  BOX_MOVE_TO_SAFE_POS
  LOAD_MATERIAL_END

[gcode_macro LOAD_MATERIAL_END]
description: End spool holder loading process
gcode:
  RESPONSE_INFO PREFIX="[LOAD_MATERIAL_END]" MSG="Material loading process finished."
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro QUIT_MATERIAL]
description: Unload material from spool holder with automatic cleaning, cutting and cooling
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  RESPONSE_INFO PREFIX="[QUIT_MATERIAL]" MSG="Start unloading material..."
  BOX_GO_TO_EXTRUDE_POS
  FILAMENT_RACK_SET_TEMP
  BOX_MOVE_TO_CUT
  M400
  G91
  G0 E-10 F360
  G90
  M400
  BOX_MOVE_TO_SAFE_POS
  SET_COOL_TEMP
  QUIT_MATERIAL_END

[gcode_macro QUIT_MATERIAL_END]
description: End spool holder unloading process
gcode:
  RESPONSE_INFO PREFIX="[QUIT_MATERIAL_END]" MSG="Material unloading process finished."
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro COOLING_AFTER_LOAD_OR_QUIT_MATERIAL]
description: Cooling after load or unload material
gcode:
  RESPONSE_INFO PREFIX="[COOLING_AFTER_LOAD_OR_QUIT_MATERIAL]" MSG="Start cooling after load or unload material..."
  {% if printer_state == "paused" %}
    M104 S140 # Keep the temperature for better resume performance
  {% elif printer_state == "printing" %}
    # M104 S140  # Do not handle
  {% else %}
    M104 S0 # Turn off the heater if not printing or paused
  {% endif %}

[gcode_macro EXTRUDE_BEFORE_CLEAR]
description: Normal extrude before nozzle clean
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  RESPONSE_INFO PREFIX="[EXTRUDE_BEFORE_CLEAR]" MSG="Extruding before box nozzle clean..."
  G91
  G1 E60 F180
  M400
  BOX_NOZZLE_CLEAN
  M104 S0
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro TPU_EXTRUDE_BEFORE_CLEAR]
description: TPU extrude before nozzle clean
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  RESPONSE_INFO PREFIX="[TPU_EXTRUDE_BEFORE_CLEAR]" MSG="TPU extruding before box nozzle clean..."
  G91
  G1 E60 F60
  M400
  BOX_NOZZLE_CLEAN
  M104 S0
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro IF_CUT_AND_COOLING]
description: Check if need to cut and cooling before printing
variable_inside_cut: 0
variable_resumed: 0
gcode:
  RESPONSE_INFO PREFIX="[IF_CUT_AND_COOLING]" MSG="Check if need to cut and cooling before printing."
  SET_GCODE_VARIABLE MACRO=IF_CUT_AND_COOLING VARIABLE=resumed VALUE=0
  {% if printer['gcode_macro IF_CUT_AND_COOLING'].inside_cut|int == 0 %}
    {% if printer['motor_control'].cut.state |lower == 'true' %}
      RESPONSE_INFO PREFIX="[IF_CUT_AND_COOLING]" MSG="Last cut_present value is true, need to cut."
      SET_GCODE_VARIABLE MACRO=IF_CUT_AND_COOLING VARIABLE=inside_cut VALUE=1
      UPDATE_DELAYED_GCODE ID=CUT_AND_COOLING_AFTER_PRINTER_PAUSED DURATION=1
    {% else %}
      RESPONSE_INFO PREFIX="[IF_CUT_AND_COOLING]" MSG="Last cut_present value is false, no need to cut."
      {% set x_park = 0 %}
      {% set y_park = 260 %}
      G91
      FORCE_MOVE_E E=-2
      G90
      M104 S140
      M400
      G1 X{x_park} Y{y_park} F6000
      RESPONSE_INFO PREFIX="[IF_CUT_AND_COOLING]" MSG="Finished."
    {% endif %}
  {% else %}
    RESPONSE_INFO PREFIX="[IF_CUT_AND_COOLING]" MSG="Already inside."
  {% endif %}

[delayed_gcode CUT_AND_COOLING_AFTER_PRINTER_PAUSED]
# description: Cut and cooling after printer pause
gcode:
  {% if printer['print_stats'].state|lower == 'paused' %}
    RESPONSE_INFO PREFIX="[CUT_AND_COOLING_AFTER_PRINTER_PAUSED]" MSG="Printer is paused. Cutting..."
    DO_CUT
    SET_GCODE_VARIABLE MACRO=IF_CUT_AND_COOLING VARIABLE=inside_cut VALUE=0
  {% else %}
    {% if printer['gcode_macro IF_CUT_AND_COOLING'].resumed|int == 0 %}
      RESPONSE_INFO PREFIX="[CUT_AND_COOLING_AFTER_PRINTER_PAUSED]" MSG="Printer is not paused, waiting..."
      UPDATE_DELAYED_GCODE ID=CUT_AND_COOLING_AFTER_PRINTER_PAUSED DURATION=1
    {% else %}
      SET_GCODE_VARIABLE MACRO=IF_CUT_AND_COOLING VARIABLE=inside_cut VALUE=0
      RESPONSE_INFO PREFIX="[CUT_AND_COOLING_AFTER_PRINTER_PAUSED]" MSG="Resuming print..."
    {% endif %}
  {% endif %}

[gcode_macro DO_CUT]
description: Cut filament
gcode:
  {% if printer['gcode_macro IF_CUT_AND_COOLING'].resumed|int == 0 %}
    RESPONSE_INFO PREFIX="[DO_CUT]" MSG="Start cut..."
    {% set x_park = 0 %}
    {% set y_park = 260 %}
    # BOX_MOVE_TO_CUT
    PAUSE_CUT
    M104 S140
    M400
    G1 X{x_park} Y{y_park} F6000
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    UPDATE_DELAYED_GCODE ID=COOLING_AFTER_PRINTER_PAUSED DURATION=900
    RESPONSE_INFO PREFIX="[DO_CUT]" MSG="Cut finished!"
  {% else %}
    RESPONSE_INFO PREFIX="[DO_CUT]" MSG="Resuming print..."
  {% endif %}

[gcode_macro DO_COOLING]
description: Cool nozzle
gcode:
  {% if printer['gcode_macro IF_CUT_AND_COOLING'].resumed|int == 0 %}
    RESPONSE_INFO PREFIX="[DO_COOLING]" MSG="Start cooling..."
    M104 S0
  {% else %}
    RESPONSE_INFO PREFIX="[DO_COOLING]" MSG="Resuming print, do nothing."
  {% endif %}

[delayed_gcode COOLING_AFTER_PRINTER_PAUSED]
# description: Cooling after printer pause
gcode:
  {% if printer['print_stats'].state|lower == 'paused' %}
    RESPONSE_INFO PREFIX="[COOLING_AFTER_PRINTER_PAUSED]" MSG="Printer is paused. Cooling..."
    DO_COOLING
  {% else %}
    RESPONSE_INFO PREFIX="[COOLING_AFTER_PRINTER_PAUSED]" MSG="Printer is not paused, do nothing."
  {% endif %}
