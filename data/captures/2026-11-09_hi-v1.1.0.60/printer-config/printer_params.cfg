# Printer parameters for Creality Hi
# General printer kinematics and limits and custom macros used in custom Creality methods.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

# Printer kinematics and limits
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 12000
max_accel_to_decel: 12000
max_z_velocity: 20
square_corner_velocity: 8.0
square_corner_max_velocity: 200.0
max_z_accel: 500

# Default temperatures for common operations
[custom_macro]
default_bed_temp: 60
default_extruder_temp: 240
g28_ext_temp: 140

# Fan speed feedback pins
[fan_feedback]
fan0_pin: ^nozzle_mcu:PA9  # Backplane fan
fan1_pin: ^nozzle_mcu:PA10 # Model fan
fan2_pin: ^nozzle_mcu:PB9  # Model fan
print_delay_time: 5
current_delay_time: 2

[gcode_macro product_param]
description: Product parameters
# Printable volume dimensions
variable_bed_size_x: 260
variable_bed_size_y: 260
variable_bed_size_z: 300
# Max temperatures
variable_nozzle_temp: 300
variable_bed_temp: 100
gcode:

[gcode_macro PRINTER_PARAM]
description: Printer parameters
# Printer limits and default values
variable_max_nozzle_temp: 300
variable_max_bed_temp: 100
variable_max_x_position: 260.0
variable_max_y_position: 260.0
variable_max_z_position: 300.0

# Printing status variables for other macros (e.g., pause/resume)
variable_hotend_temp: 0
variable_bed_temp: 0
variable_z_safe_pause: 0.0
variable_fan_speed: 0

# Variables to delete (may be used in other opaqued macros like filament_rack, box, etc.)
variable_auto_g29: 0
variable_print_calibration: 0
variable_g28_extruder_temp: 140
variable_fan_min: 51
variable_default_bed_temp: 60
variable_default_extruder_temp: 220
variable_default_acc: 12000
gcode:

[gcode_macro STRUCTURE_PARAM]
description: Structure parameters
# Printable volume dimensions
variable_bed_size_x: 260
variable_bed_size_y: 260
variable_bed_size_z: 300
