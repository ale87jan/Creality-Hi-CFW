# Creality custom printing modes
# Dual printing speed profiles: Quiet mode reduces velocity to 150 and acceleration to 2500 for silent printing, while
# Rapid mode increases velocity to 300 and acceleration to 5000 for high-speed printing.
# This file is included by printer.cfg and should not be edited directly.

# Author: Alejandro Lara
# Date: 2026-03-09
# Version: v1.1.0.60-cfw.1

[gcode_macro Qmode]
description: Enter Quiet mode for silent printing
variable_flag: 0
variable_accel: 0
variable_accel_to_decel: 0
variable_velocity: 0
variable_square_corner_velocity: 0.0
variable_pressure_advance:0.0
variable_fan_speed: 0.0 # Store previous fan speed (previosly fan0_value)
variable_speed_factor: 0.0
variable_max_accel: 2500
variable_max_accel_to_decel: 2500
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Qmode'].flag|int == 0 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      RESPONSE_INFO PREFIX="[QMODE]" MSG="Entering Quiet Mode. Reducing speed and acceleration for quieter operation."

      # Save Current Settings
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel VALUE={printer.toolhead.max_accel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel_to_decel VALUE={printer.toolhead.max_accel_to_decel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=velocity VALUE={printer.toolhead.max_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pressure_advance VALUE={printer.extruder.pressure_advance}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan_speed VALUE={printer.fan.speed * 255}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=speed_factor VALUE={printer.gcode_move.speed_factor}

      # Set Motion Parameters
      SET_VELOCITY_LIMIT ACCEL=2500 ACCEL_TO_DECEL=2500 VELOCITY=150 SQUARE_CORNER_VELOCITY=5
      SET_PRESSURE_ADVANCE ADVANCE=0.05

      M220 S40 # Set speed factor to 40%

      {% if printer.fan.speed != 0 %}
        M106 S1 # Set fan speed to minimum for quiet operation
      {% endif %}

      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=1
      SET_QMODE_FLAG FLAG=1
    {% endif %}
  {% endif %}

[gcode_macro Qmode_exit]
description: Exit Quiet mode and restore previous settings
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Qmode'].flag|int == 1 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      RESPONSE_INFO PREFIX="[QMODE_EXIT]" MSG="Exiting Quiet Mode. Restoring previous speed and acceleration settings."

      SET_VELOCITY_LIMIT ACCEL={printer['gcode_macro Qmode'].accel|int}
      SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer['gcode_macro Qmode'].accel_to_decel|int}
      SET_VELOCITY_LIMIT VELOCITY={printer['gcode_macro Qmode'].velocity|int}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer['gcode_macro Qmode'].square_corner_velocity|float}
      SET_PRESSURE_ADVANCE ADVANCE={printer['gcode_macro Qmode'].pressure_advance|float}
      M220 S{100 * printer['gcode_macro Qmode'].speed_factor|float} # Restore speed factor

      {% if printer.fan.speed != 0 %}
        M106 S{printer['gcode_macro Qmode'].fan_speed|int}
      {% endif %}

      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=0
      SET_QMODE_FLAG FLAG=0
    {% endif %}
  {% endif %}

[gcode_macro Rmode]
description: Enter Rapid mode for high-speed printing
variable_flag: 0
variable_accel: 0
variable_accel_to_decel: 0
variable_velocity: 0
variable_pressure_advance:0.0
variable_square_corner_velocity: 0
variable_fan_value: 0.00
variable_speed_factor: 0
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Rmode'].flag|int == 0 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      RESPONSE_INFO PREFIX="[RMODE]" MSG="Entering Rapid Mode for high-speed printing."

      # Save Current Settings
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=accel VALUE={printer.toolhead.max_accel}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=accel_to_decel VALUE={printer.toolhead.max_accel_to_decel}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=velocity VALUE={printer.toolhead.max_velocity}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=pressure_advance VALUE={printer.extruder.pressure_advance}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=fan_value VALUE={printer.fan.speed * 255}
      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=speed_factor VALUE={printer.gcode_move.speed_factor}

      # Set Motion Parameters
      SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000 VELOCITY=300 SQUARE_CORNER_VELOCITY=10
      SET_PRESSURE_ADVANCE ADVANCE=0.03
      M220 S125 # Set speed factor to 125%

      {% if (printer.fan.speed * 255) < 200 %}
        M106 S200 # Increase fan speed to 200 for better cooling
      {% endif %}

      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=flag VALUE=1
      SET_RMODE_FLAG FLAG=1
    {% endif %}
  {% endif %}

[gcode_macro Rmode_exit]
description: Exit Rapid mode and restore previous settings
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Rmode'].flag|int == 1 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      RESPONSE_INFO PREFIX="[RMODE_EXIT]" MSG="Exiting Rapid Mode. Restoring previous speed and acceleration settings."

      SET_VELOCITY_LIMIT ACCEL={printer['gcode_macro Rmode'].accel|int}
      SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer['gcode_macro Rmode'].accel_to_decel|int}
      SET_VELOCITY_LIMIT VELOCITY={printer['gcode_macro Rmode'].velocity|int}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer['gcode_macro Rmode'].square_corner_velocity|float}
      SET_PRESSURE_ADVANCE ADVANCE={printer['gcode_macro Rmode'].pressure_advance|float}
      M220 S{printer['gcode_macro Rmode'].speed_factor * 100}

      {% if printer.fan.speed != 0 %}
        M106 S{printer['gcode_macro Rmode'].fan_value|int}
      {% endif %}

      SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=flag VALUE=0
      SET_RMODE_FLAG FLAG=0
    {% endif %}
  {% endif %}
